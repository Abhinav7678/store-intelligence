name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov

    - name: Lint (non-blocking)
      run: flake8 . --max-line-length=120 --exclude=.venv,nv,test_env || true

    - name: Run tests with coverage
      run: pytest -q --cov=app --cov-report=xml --cov-report=html

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          htmlcov/
          coverage.xml
        if-no-files-found: warn

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true        # ← key line: failures are warnings, not blockers
    steps:
    - uses: actions/checkout@v4

    - name: Build and start the stack
      run: docker compose up --build -d

    - name: Wait for API to come up
      run: |
        for i in {1..30}; do
          if curl -sf http://localhost:8000/health > /dev/null; then
            echo "✅ API is up"
            exit 0
          fi
          sleep 2
        done
        echo "❌ API failed to start"
        docker compose logs
        exit 1

    - name: Verify mandatory endpoints respond
      run: |
        curl -sf http://localhost:8000/health
        curl -sf http://localhost:8000/stores/ST1008/metrics
        curl -sf http://localhost:8000/stores/ST1008/funnel
        curl -sf http://localhost:8000/stores/ST1008/heatmap
        curl -sf http://localhost:8000/stores/ST1008/anomalies

    - name: Tear down
      if: always()
      run: docker compose down